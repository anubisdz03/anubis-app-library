name: YouTube to Telegram Notifier

# Watches the YouTube channel RSS feed and sends a Telegram message for each
# newly published video. The last-video state is restored/saved with Actions
# cache so this workflow does not need repository write permissions.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Avoid concurrent runs racing to notify the same video or update the cache.
concurrency:
  group: youtube-notify
  cancel-in-progress: false

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore last-video state
        uses: actions/cache/restore@v4
        with:
          path: .github/state/last_video.json
          key: youtube-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            youtube-notifier-state-

      - name: Record state before check
        id: state_before
        shell: bash
        run: |
          if [ -f .github/state/last_video.json ]; then
            echo "hash=$(sha256sum .github/state/last_video.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "hash=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The dependency is installed on the runner and is not saved into the repo.
      - name: Install dependencies
        run: npm install rss-parser@3.13.0 --no-save --no-audit --no-fund

      - name: Run YouTube -> Telegram check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CHANNEL_ID: UCz7Q8mpWfogkgSaZdBbxOVw
        run: node .github/scripts/youtube_notify.js

      - name: Record state after check
        id: state_after
        if: success()
        shell: bash
        run: |
          if [ -f .github/state/last_video.json ]; then
            echo "hash=$(sha256sum .github/state/last_video.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "hash=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Save updated last-video state
        if: success() && steps.state_before.outputs.hash != steps.state_after.outputs.hash
        uses: actions/cache/save@v4
        with:
          path: .github/state/last_video.json
          key: youtube-notifier-state-${{ github.run_id }}-${{ github.run_attempt }}
